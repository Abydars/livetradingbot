# Drop this file in /etc/nginx/sites-available/livetradingbot
# then: ln -s /etc/nginx/sites-available/livetradingbot /etc/nginx/sites-enabled/
# The gzip, timeout, and body-size directives below go inside the server block;
# the system /etc/nginx/nginx.conf already provides events{} and http{}.

upstream bot {
    server 127.0.0.1:8765;
}

server {
    listen 80;
    server_name _;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/javascript application/xml;
    gzip_min_length 1024;
    gzip_proxied    any;

    # ── Request body ─────────────────────────────────────────────────────────
    client_max_body_size 10m;    # TradingView webhook payloads

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # ── WebSocket (/ws) ───────────────────────────────────────────────────────
    location /ws {
        proxy_pass         http://bot;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        proxy_read_timeout 3600s;    # 1 hour — keep WS alive
        proxy_send_timeout 3600s;
    }

    # ── All other requests (UI + REST API + webhooks) ─────────────────────────
    location / {
        proxy_pass         http://bot;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
